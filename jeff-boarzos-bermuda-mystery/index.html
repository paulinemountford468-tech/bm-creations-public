let index=0;
const book=document.getElementById("book");
pages.forEach((p,i)=>{const el=document.createElement("div");el.className="page";const img=document.createElement("img");img.src=p.src;img.alt=p.title;el.appendChild(img);book.appendChild(el);});
function render(){[...book.children].forEach((el,i)=>el.className="page "+(i<index?"before":i===index?"active":"after"));counter.textContent=(index+1)+" / "+pages.length+" — "+pages[index].title;prev.disabled=index===0;next.disabled=index===pages.length-1;}
prev.onclick=()=>{if(index>0){index--;render();}};
next.onclick=()=>{if(index<pages.length-1){index++;render();}};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&index<pages.length-1){index++;render()}if(e.key==="ArrowLeft"&&index>0){index--;render()}});
render();
</script>
