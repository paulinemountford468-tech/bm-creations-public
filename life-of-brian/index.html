let current=0, busy=true, requestId=0;
const img=document.getElementById('page'), status=document.getElementById('status');
const prev=document.getElementById('prev'), next=document.getElementById('next'), cover=document.getElementById('cover');
function controls(){prev.disabled=busy||current===0;cover.disabled=busy||current===0;next.disabled=busy||current===pages.length-1;}
function loadPage(target){
 target=Math.max(0,Math.min(pages.length-1,target));
 if(busy||target===current&&img.dataset.ready==='1') return;
 busy=true; controls();
 const my=++requestId;
 status.textContent='Loading '+pages[target].label+'…';
 img.style.visibility='hidden';
 img.onload=()=>{
   if(my!==requestId) return;
   current=target; img.dataset.ready='1'; img.style.visibility='visible';
   status.textContent=pages[current].label+' • '+(current+1)+' of '+pages.length;
   busy=false; controls();
 };
 img.onerror=()=>{if(my!==requestId)return; status.textContent='Could not load '+pages[target].label+' — please press again'; img.style.visibility='visible'; busy=false; controls();};
 img.dataset.ready='0';
 img.src=pages[target].src+'?r=20261005b';
}
prev.onclick=()=>loadPage(current-1); next.onclick=()=>loadPage(current+1); cover.onclick=()=>loadPage(0);
// No swipe, animation, auto-turn, keyboard, or preloading.
current=0; busy=false; loadPage(0);
