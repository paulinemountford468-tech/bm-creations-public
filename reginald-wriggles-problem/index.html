<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reginald Wriggles' Problem</title><style>html,body{margin:0;height:100%;background:#25150e;color:#fff;font-family:Georgia,serif}body{display:grid;place-items:center}#m{padding:24px;text-align:center}</style></head><body><div id="m">Opening REGINALD WRIGGLES' PROBLEM…</div><script>(async()=>{const parts=["part-00.txt","part-01.txt","part-02.txt","part-03.txt","part-04.txt","part-05.txt","part-06.txt","part-07.txt","part-08.txt","part-09.txt","part-10.txt","part-11.txt","part-12.txt","part-13.txt","part-14.txt","part-15.txt","part-16.txt","part-17.txt","part-18.txt","part-19.txt","part-20.txt","part-21.txt","part-22.txt","part-23.txt","part-24.txt"];let h='';for(const f of parts){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error('Missing '+f);h+=await r.text();}h=h.replace('</style>','.page.storylandscape{position:relative;width:min(calc(100vw - 116px),calc((100vh - 92px)*1.49481));height:auto;aspect-ratio:864/578;max-height:none;background:#2b170d;border:4px solid #d8a62f;overflow:hidden}.page.storylandscape img{position:absolute;width:118.5185%;height:auto;max-width:none;max-height:none;left:-9.2593%;top:-84.083%;object-fit:unset;background:none}</style>');h=h.replace("function show(){img.src=pages[i]; count.textContent=(i+1)+' / '+pages.length; prev.disabled=i===0; next.disabled=i===pages.length-1}","function show(){img.src=pages[i]; count.textContent=(i+1)+' / '+pages.length; prev.disabled=i===0; next.disabled=i===pages.length-1; const p=document.querySelector('.page'); if(i>=2&&i<=8){p.classList.add('storylandscape')}else{p.classList.remove('storylandscape')}}");document.open();document.write(h);document.close();})().catch(e=>{document.getElementById('m').textContent='Unable to open flipbook: '+e.message;});</script></body></html>
