<script>
const pages = Array.from(document.querySelectorAll('main > section'))
const previous = document.getElementById('previous')
const next = document.getElementById('next')
const label = document.getElementById('label')
let current = 0
function showPage(index) {
  if (index < 0 || index >= pages.length) return
  pages[current].hidden = true
  current = index
  pages[current].hidden = false
  label.textContent = pages[current].getAttribute('aria-label')
  previous.disabled = current === 0
  next.disabled = current === pages.length - 1
  window.scrollTo(0, 0)
}
previous.addEventListener('click', () => showPage(current - 1))
next.addEventListener('click', () => showPage(current + 1))
document.addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft') showPage(current - 1)
  if (event.key === 'ArrowRight') showPage(current + 1)
})
</script></html>
