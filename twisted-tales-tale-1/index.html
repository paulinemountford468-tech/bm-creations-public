<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frank and the Office Mice | BM Creations Page 59</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ece7dd;color:#28221c;font:1rem system-ui,sans-serif}
header,main,footer{width:min(94%,820px);margin:auto}header{padding:1.1rem 0 .6rem}
h1{font:700 clamp(1.45rem,4vw,2.2rem) Georgia,serif;margin:.65rem 0}.series{margin:0}
a{color:#582d21}nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem;padding:.6rem 0;background:#ece7dd;position:sticky;top:0}
button,select{font:inherit;min-height:44px;padding:.45rem .65rem;border:1px solid #9a8879;border-radius:.35rem;background:#fffdf7;color:inherit}button:disabled{opacity:.5}
figure{margin:0;background:#faf7ef;box-shadow:0 2px 12px #33251a29}figure img{display:block;width:100%;height:auto;aspect-ratio:210/297;object-fit:contain}footer{padding:1.25rem 0;text-align:center}footer img{display:block;width:112px;height:112px;margin:.6rem auto;background:white}
</style>
</head>
<body>
<header><a href="https://bm-creations-public.vercel.app/BM_MAIN_ENTRANCE_40.html#page-59">Back to BM Main Entrance</a><h1>Frank and the Office Mice</h1><p class="series">BM Twisted Tales · Tale No. 1 · Archive Page 59</p></header>
<main>
<nav aria-label="Flipbook navigation"><button id="previous" type="button">Previous</button><select id="jump" aria-label="Go to page"><option value="0">Front cover</option><option value="1">Story page 1</option><option value="2">Story page 2</option><option value="3">Story page 3</option><option value="4">Story page 4</option><option value="5">Story page 5</option><option value="6">Story page 6</option><option value="7">Back cover</option></select><button id="next" type="button">Next</button><span id="count" aria-live="polite"></span></nav>
<figure><img id="page" src="assets/front-cover.webp" width="1240" height="1754" alt="Front cover"></figure>
</main>
<footer><a href="https://bm-creations-public.vercel.app/twisted-tales-tale-1/">Public link to this flipbook</a><img src="assets/page59-qr.svg" alt="QR code for Page 59"></footer>
<script>
const images = ["assets/front-cover.webp", "assets/story-1.webp", "assets/story-2.webp", "assets/story-3.webp", "assets/story-4.webp", "assets/story-5.webp", "assets/story-6.webp", "assets/back-cover.webp"];
const labels = ["Front cover", "Story page 1", "Story page 2", "Story page 3", "Story page 4", "Story page 5", "Story page 6", "Back cover"];
const page = document.querySelector('#page');
const jump = document.querySelector('#jump');
const previous = document.querySelector('#previous');
const next = document.querySelector('#next');
const count = document.querySelector('#count');
let current = 0;

function show(index, updateUrl = false) {
  current = Math.max(0, Math.min(index, images.length - 1));
  page.src = images[current];
  page.alt = labels[current];
  jump.value = current;
  previous.disabled = current === 0;
  next.disabled = current === images.length - 1;
  count.textContent = (current + 1) + ' of ' + images.length;
  if (updateUrl && location.protocol.startsWith('http')) {
    const url = new URL(location.href);
    url.searchParams.set('page', current);
    history.replaceState(null, '', url);
  }
}
previous.addEventListener('click', () => show(current - 1, true));
next.addEventListener('click', () => show(current + 1, true));
jump.addEventListener('change', () => show(Number(jump.value), true));
document.addEventListener('keydown', (event) => {
  if (event.target === jump || event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.key === 'ArrowRight') show(current + 1, true);
  if (event.key === 'ArrowLeft') show(current - 1, true);
});
const requested = new URLSearchParams(location.search).get('page') ?? '0';
show(/^\d+$/.test(requested) ? Number(requested) : 0);
</script>
</body>
</html>
