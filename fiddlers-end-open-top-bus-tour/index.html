<style>
* { box-sizing: border-box; }
body { background: #203528; color: #512618; margin: 0; font: 18px Georgia, serif; }
nav { position: sticky; z-index: 1; top: 0; padding: .6rem; background: #18291f; color: #fff6dd; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .55rem; font: 15px system-ui; }
button, a { color: #412517; border: 1px solid #d1a951; background: #fff0c5; font: inherit; padding: .4rem .65rem; border-radius: .3rem; text-decoration: none; cursor: pointer; }
button:disabled { opacity: .55; cursor: auto; }
#position { min-width: 90px; text-align: center; }
main { width: min(100% - 16px, 720px); margin: 12px auto 30px; }
section { position: relative; aspect-ratio: 210 / 297; background: #f9eed0; box-shadow: 0 6px 24px #0008; }
img { display: block; width: 100%; height: 100%; object-fit: contain; }
.cover { display: flex; flex-direction: column; justify-content: center; text-align: center; background: radial-gradient(ellipse, #fff4d1 35%, #d5a867); border: 8px double #956429; outline: 2px solid #59744b; outline-offset: -18px; }
.cover h1 { margin: .12em 0; color: #822c23; font-size: clamp(45px, 11vw, 95px); line-height: 1; }
.cover p:first-child { text-transform: uppercase; letter-spacing: .1em; font-weight: bold; }
small { position: absolute; left: 5mm; bottom: 5mm; font-size: 8px; }
[hidden] { display: none; }
@page { size: A4 portrait; margin: 0; }
@media print {
 body { background: white; } nav { display: none; } main { width: auto; margin: 0; }
 section, section[hidden] { display: block; width: 210mm; height: 297mm; box-shadow: none; break-after: page; }
 .cover, .cover[hidden] { display: flex; } section:last-child { break-after: auto; }
}

main:has(.story-spread:not([hidden])) { width: min(100% - 24px, 1232px); }
.story-spread { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; aspect-ratio:auto; background:transparent; box-shadow:none; align-items:start; }
.story-spread[hidden] { display:none; }
.story-text, .story-art { position:relative; aspect-ratio:210 / 297; background:#fff3d4; box-shadow:0 6px 24px #0008; }
.story-text { padding: clamp(24px, 3vw, 38px); border: 6px double #956429; color:#332719; font-size:clamp(16px, 1.45vw, 17px); line-height:1.36; }
.story-text h1 { color:#822c23; font-size:clamp(30px, 4.2vw, 52px); margin:0 0 .5em; line-height:1; }
.story-text p { margin:0 0 .65em; }
.story-text footer { text-align:center; font-weight:bold; }
.story-art img { width:100%; height:100%; }
@media screen and (max-width: 920px) {
 main:has(.story-spread:not([hidden])) { width:min(100% - 16px, 720px); }
 .story-spread { grid-template-columns:1fr; }
}
@media print {
 main:has(.story-spread:not([hidden])) { width:auto; }
 .story-spread, .story-spread[hidden] { display:block; height:auto; }
 .story-text, .story-art { width:210mm; height:297mm; box-shadow:none; }

<script>
const pages = Array.from(document.querySelectorAll('main section'));
const previous = document.getElementById('prev');
const next = document.getElementById('next');
const position = document.getElementById('position');
let current = 0;
function turnTo(index) {
    current = Math.max(0, Math.min(index, pages.length - 1));
    pages.forEach((page, number) => { page.hidden = number !== current; });
    previous.disabled = current === 0;
    next.disabled = current === pages.length - 1;
    position.textContent = (current + 1) + ' / ' + pages.length + ' · ' + pages[current].getAttribute('aria-label');
    window.scrollTo(0, 0);
}
previous.onclick = () => turnTo(current - 1);
next.onclick = () => turnTo(current + 1);
document.addEventListener('keydown', event => {
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
        event.preventDefault();
        turnTo(current + (event.key === 'ArrowRight' ? 1 : -1));
    }
});
turnTo(0);
</script>
