<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Page 48 — Artwork Created by BM</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font:17px system-ui}header,nav,aside{max-width:1000px;margin:auto;padding:16px;text-align:center}h1{font-size:clamp(23px,4vw,34px);color:#edce80;margin:8px}p{margin:8px}a{color:#edce80}button,select{font:inherit;padding:10px 14px;border-radius:7px;border:1px solid #bda05c;background:#f9edcc;color:#142035;margin:5px;cursor:pointer}button:disabled{opacity:.4;cursor:default}figure{margin:0 auto;text-align:center;width:min(96vw,calc((100dvh - 225px)*210/297));aspect-ratio:210/297;background:white;perspective:1400px}figure.zoom{width:min(96vw,1000px)}img{display:block;max-width:100%;height:auto;width:100%;height:100%;margin:auto;object-fit:contain}figure.turn{animation:turn .3s ease}@keyframes turn{from{opacity:.35;transform:rotateY(-14deg)}to{opacity:1;transform:rotateY(0)}}aside{color:#c9d0dc;font-size:14px}summary{cursor:pointer}#status{display:inline-block;min-width:120px}@media print{@page{size:A4 portrait;margin:0}header,nav,aside{display:none}figure{width:210mm;height:297mm}img{max-height:none}}</style><header><h1>ARTWORK CREATED BY BM</h1><p>Main Entrance Page 48 · Brian Mountford · A4 portrait artwork collection</p><p>14 artwork pages · One uploaded image per page</p><a href="/BM_MAIN_ENTRANCE_40.html#page-48">Back to Main Entrance</a></header><nav aria-label="Flipbook navigation"><button id="prev">← Previous</button><span id="status" aria-live="polite"></span><button id="next">Next →</button><button id="enlarge">Enlarge page</button><br><select id="jump" aria-label="Choose an artwork"></select></nav><figure id="sheet"><img id="card" alt=""></figure><aside><p>Use the buttons or the left and right arrow keys to turn pages.</p><p>© Brian Mountford · B. M. Creations</p></aside><script>const pages=[];</script><script src="art-01.js"></script><script src="art-02.js"></script><script src="art-03.js"></script><script src="art-04.js"></script><script src="art-05.js"></script><script src="art-06.js"></script><script src="art-07.js"></script><script src="art-08.js"></script><script src="art-09.js"></script><script src="art-10.js"></script><script src="art-11.js"></script><script src="art-12.js"></script><script src="art-13.js"></script><script src="art-14.js"></script><script>let i=0;const card=document.querySelector('#card'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),jump=document.querySelector('#jump'),sheet=document.querySelector('#sheet');pages.forEach((p,n)=>jump.add(new Option(p.title,n)));function show(n){i=Math.max(0,Math.min(pages.length-1,n));card.src=pages[i].src;card.alt=pages[i].title;document.querySelector('#status').textContent=`Page ${i+1} of ${pages.length}`;jump.value=i;prev.disabled=i===0;next.disabled=i===pages.length-1;sheet.classList.remove('turn');void sheet.offsetWidth;sheet.classList.add('turn')}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);jump.onchange=()=>show(+jump.value);document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});document.querySelector('#enlarge').onclick=()=>{sheet.classList.toggle('zoom');document.querySelector('#enlarge').textContent=sheet.classList.contains('zoom')?'Fit page to screen':'Enlarge page'};show(0);</script></html>
