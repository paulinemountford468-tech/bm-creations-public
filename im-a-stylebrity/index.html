<script>
const pages=[
 {src:'assets/cover.webp',label:'Cover',alt:'I’m a Stylebrity — Get Me Out of Here! comic cover'},
 {src:'assets/page-1.webp',label:'Page 1',alt:'ALIEHAM comic page 1'},
 {src:'assets/page-2.webp',label:'Page 2',alt:'ALIEHAM comic page 2'},
 {src:'assets/page-3.webp',label:'Page 3',alt:'ALIEHAM comic page 3'},
 {src:'assets/page-4.webp',label:'Page 4',alt:'ALIEHAM comic page 4'},

 {src:'assets/page-6.webp',label:'Page 6',alt:'ALIEHAM comic page 6'},
 {src:'assets/page-7.webp',label:'Page 7',alt:'ALIEHAM comic page 7'},
 {src:'assets/back-cover.webp',label:'Back cover',alt:'ALIEHAM comic back cover'}
];
let index=0;const img=document.getElementById('comicPage'),caption=document.getElementById('caption'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');
function show(n){index=Math.max(0,Math.min(pages.length-1,n));const p=pages[index];img.src=p.src;img.alt=p.alt;caption.textContent=p.label;counter.textContent=`${p.label} · ${index+1} of ${pages.length}`;prev.disabled=index===0;next.disabled=index===pages.length-1;history.replaceState(null,'',`#page=${index+1}`)}
prev.addEventListener('click',()=>show(index-1));next.addEventListener('click',()=>show(index+1));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1)});const start=Number(new URLSearchParams(location.hash.slice(1)).get('page'));if(start>1)show(start-1);else show(0);
</script>
